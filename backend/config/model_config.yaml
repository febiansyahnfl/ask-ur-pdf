# LLM Configuration 
llm:
  provider: gemini #default provider

  models:
    gemini:
      name: gemini-pro
      temperature: 0.7
      max_tokens: 2048
      top_p: 0.95

    openai:
      name: gpt-3.5-turbo
      temperature: 0.7
      max_tokens: 2048
      top_p: 1.0
    
# Embeddings Configuration
embeddings:
  provider: gemini
  
  models:
    gemini:
      name: models/embeddings-001
      dimension: 768

  openai:
    name: text-embedding-ada-002
    dimension: 1536

# RAG Configuration
rag:
  chunking:
    chunk_size: 500
    chunk_overlap: 50
    separator: "\n\n"

  retrieval:
    top_k: 5
    similarity_threshold: 0.7
    rerank: false

# Vector Store Configuration
vector_store:
  type: faiss
  persist_directory: data/vector_db
  collection_name: pdf_documents